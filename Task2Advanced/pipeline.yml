name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "Task2Advanced/**"
  pull_request:
    branches:
      - main
    paths:
      - "Task2Advanced/**"

env:
  TF_VERSION: "1.16.5"
  WORKING_DIR: "Task2Advanced"
  YC_TOKEN: ${{ secrets.YC_TOKEN }}
  YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY }}
  YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_KEY }}

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: "${{ env.WORKING_DIR }}"
        run: |
          terraform init \
            -backend-config="access_key=${{ env.YC_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ env.YC_SECRET_ACCESS_KEY }}"

      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        id: plan
        run: |
          terraform plan \
            -var="ssh_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="vm_name=test-vm" \
            -var="cores=2" \
            -var="memory=4" \
            -var="disk_size_gb=15" \
            -var="zone=ru-central1-a" \
            -var="subnet_id=${{ secrets.SUBNET_ID }}" \
            -no-color \
            -out=tfplan
        continue-on-error: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="access_key=${{ env.YC_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ env.YC_SECRET_ACCESS_KEY }}"

      - name: Download Plan Artifact
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
